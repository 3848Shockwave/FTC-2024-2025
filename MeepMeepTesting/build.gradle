plugins {
    id 'java'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
    maven { url = 'https://maven.brott.dev/' }

}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.acmerobotics.roadrunner:MeepMeep:0.1.6'

}

test {
    useJUnitPlatform()
}